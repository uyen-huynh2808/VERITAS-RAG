system:
  seed: 42

db:
  incoming_dir: "data/incoming"
  duckdb_path: "data/silver/lakehouse.duckdb"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"
  quarantine_dir: "data/quarantine"

chunking:
  article_level: true
  max_tokens: 512
  overlap: 64

parser:
  prefer_docling: true
  header_ocr_engine: "torch"

contracts:
  rules_path: "config/contract_rules.json"

models:
  embedding_model: "BAAI/bge-m3"
  embedding_batch_size: 16
  embedding_max_length: 512
  llm_model: "openai/gpt-oss-120b"
  generation_temperature: 0.0
  generation_max_tokens: 512
  generation_reasoning_effort: "low"
  generation_include_reasoning: false

retrieval:
  top_k: 5
  bm25_k1: 1.5
  bm25_b: 0.75
  supersession_rules_path: null

benchmark:
  questions_path: "data/benchmark/questions.json"
  output_path: "data/splits/vn_legal_temporal_eval_split.json"
  gold_path: "data/gold/gold_chunks.parquet"
  results_dir: "results"
  cache_dir: "results/cache"
  contract_metrics_path: "results/contract/contract_metrics.json"
